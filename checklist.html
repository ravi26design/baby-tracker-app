<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Tracker — Checklist</title>
<style>
  :root{
    --ink:#3a332e; --muted:#a99c92;
    --lav-1:#b0a2d8; --lav-2:#9b8bc4; --lav-3:#8574b5;
    --field:#f3eef0; --chip:#f4f1f8;
    --shadow-card:0 18px 40px -14px rgba(120,80,95,.22);
    --shadow-soft:0 8px 22px -8px rgba(120,80,95,.18);
    --btn-shadow:0 12px 22px -10px rgba(140,116,181,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#efeaf6,#e6e0f0 55%,#ece6f4);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px 0;
    -webkit-font-smoothing:antialiased;color:var(--ink);}
  .phone{position:relative;width:390px;height:844px;border-radius:56px;background:#0c0c0c;
    box-shadow:0 50px 90px -30px rgba(40,20,30,.6),0 12px 30px rgba(40,20,30,.25),inset 0 0 0 2px #2a2a2a;overflow:hidden;}
  .screen{position:absolute;inset:11px;border-radius:46px;overflow:hidden;background:linear-gradient(180deg,#f6f3fa,#efebf5);}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;}
  .scroll::-webkit-scrollbar{display:none;}

  .statusbar{position:relative;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:700;color:var(--ink);z-index:3;}
  .statusbar .time{font-size:16px;letter-spacing:.3px;}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:20px;}
  .status-icons{display:flex;align-items:center;gap:7px;}

  .content{padding:4px 22px 20px;}
  .head h1{font-size:27px;font-weight:800;letter-spacing:-.5px;}
  .head p{font-size:13px;color:var(--muted);font-weight:500;margin-top:3px;}

  /* child tabs */
  .child-tabs{display:flex;gap:9px;margin:10px -22px -10px;padding:10px 22px 22px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .child-tabs::-webkit-scrollbar{display:none;}
  .child-tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 16px;border-radius:19px;border:none;cursor:pointer;
    font-family:inherit;background:#fff;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(139,116,181,.08);transition:transform .15s,box-shadow .2s;}
  .child-tab:active{transform:scale(.98);}
  .child-tab .ct-face{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .child-tab .ct-t{text-align:left;}
  .child-tab .ct-name{display:block;font-size:14px;font-weight:800;color:#8a8788;letter-spacing:-.2px;white-space:nowrap;}
  .child-tab .ct-age{display:block;font-size:10.5px;font-weight:700;color:#b3aab8;margin-top:1px;white-space:nowrap;}
  .child-tab .ct-t{text-align:left;line-height:1.1;}
  .child-tab.active{background:linear-gradient(155deg,#b0a2d8,#9b8bc4);box-shadow:0 12px 22px -8px rgba(140,116,181,.6);}
  .child-tab.active .ct-name{color:#fff;}
  .child-tab.active .ct-age{color:rgba(255,255,255,.8);}
  .child-tab.active .ct-face{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);}

  .sec-label{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#9a8fb3;margin:22px 4px 12px;}

  /* hub category cards */
  .hub{margin-top:20px;display:flex;flex-direction:column;gap:12px;}
  .hub-cat{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 15px;cursor:pointer;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(139,116,181,.05);transition:transform .13s;}
  .hub-cat:active{transform:scale(.99);}
  .hub-cat .hc-ic{width:48px;height:48px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 8px 16px -9px rgba(120,90,140,.5);}
  .hub-cat .hc-t{flex:1;min-width:0;}
  .hub-cat .hc-n{font-size:15.5px;font-weight:800;letter-spacing:-.2px;}
  .hub-cat .hc-d{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
  .hub-cat .hc-chev{width:28px;height:28px;border-radius:50%;background:#f6f2fb;color:#b3a6cc;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* category detail panel */
  .cat-panel{position:absolute;inset:0;border-radius:46px;overflow:hidden;z-index:22;background:linear-gradient(180deg,#f6f3fa,#efebf5);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
  .cat-panel.open{transform:translateX(0);}
  .cp-bar{flex-shrink:0;display:flex;align-items:center;gap:13px;padding:6px 18px 12px;}
  .cp-back{width:38px;height:38px;flex-shrink:0;border:none;background:#fff;border-radius:50%;box-shadow:var(--shadow-soft);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;transition:transform .12s;}
  .cp-back:active{transform:scale(.94);}
  .cp-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .cp-title{font-size:19px;font-weight:800;letter-spacing:-.3px;}
  .pack-title{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.3px;margin:18px 2px 12px;}
  .cp-sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;}
  .cp-body{flex:1;overflow-y:auto;padding:4px 20px 30px;}
  .cp-body::-webkit-scrollbar{display:none;}

  /* age stage chips (inside panels) */
  .stg-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:6px 0 16px;scrollbar-width:none;}
  .stg-row::-webkit-scrollbar{display:none;}
  .stg{flex:0 0 auto;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;padding:9px 14px;border-radius:14px;background:#fff;color:#8574b5;box-shadow:var(--shadow-soft);transition:.14s;}
  .stg.on{background:linear-gradient(155deg,#b0a2d8,#9b8bc4);color:#fff;box-shadow:var(--btn-shadow);}

  /* generic category card (sections) */
  .cat{position:relative;background:#fff;border-radius:22px;padding:6px 8px 8px;margin-bottom:14px;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(139,116,181,.06);overflow:hidden;}
  .cat-head{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;cursor:pointer;}
  .cat-ic{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 16px -9px rgba(120,90,140,.5);}
  .cat-t{flex:1;}
  .cat-n{font-size:15.5px;font-weight:800;letter-spacing:-.2px;}
  .cat-c{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;}
  .cat-chev{width:27px;height:27px;border-radius:50%;background:#f6f2fb;color:#b3a6cc;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .25s;}
  .cat.collapsed .cat-chev{transform:rotate(-90deg);}
  .cat-body{overflow:hidden;transition:max-height .3s ease;}
  .cat.collapsed .cat-body{max-height:0!important;}
  .ci-row{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer;transition:background .12s;}
  .ci-row:active{background:#f7f4fb;}
  .ci-row+.ci-row::before{content:'';position:absolute;left:12px;right:12px;top:0;height:1px;background:#f4eef9;}
  .cbox{width:24px;height:24px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 2px #ddd4ea;display:flex;align-items:center;justify-content:center;color:#fff;transition:.16s;}
  .cbox-r{margin-left:6px;}
  .cbox svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.16s;}
  .ci-row.done .cbox{background:linear-gradient(150deg,#a58fd8,#8f78c4);box-shadow:0 6px 12px -5px rgba(140,116,181,.6);}
  .ci-row.done .cbox svg{opacity:1;transform:scale(1);}
  .pk-ic{width:33px;height:33px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#f4f0fa;box-shadow:inset 0 0 0 1px rgba(139,116,181,.08);}
  .ci-row.done .pk-ic{opacity:.4;filter:grayscale(.5);}
  .ci-n{flex:1;font-size:14px;font-weight:600;color:var(--ink);transition:.14s;}
  .ci-row.done .ci-n{color:#bdb6c9;}
  .ci-row.done{background:#faf9fc;}
  .rem-badge{font-size:10px;font-weight:800;color:#8574b5;background:#efe9f7;padding:3px 9px;border-radius:9px;flex-shrink:0;white-space:nowrap;}
  .ess{font-size:9px;font-weight:800;color:#d6567a;background:#ffe1ea;padding:2px 7px;border-radius:7px;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0;}
  .brand-tag{font-size:10.5px;font-weight:700;color:#8574b5;background:#efe9f7;padding:3px 8px;border-radius:8px;flex-shrink:0;}
  .brand-tag.prem{background:#fff3d9;color:#9c7418;} .brand-tag.mid{background:#efe6ff;color:#6a4fc0;} .brand-tag.eco{background:#dff3e7;color:#2b7d54;}
  .qty{font-size:11.5px;font-weight:800;color:#8574b5;background:#efe9f7;padding:3px 9px;border-radius:9px;flex-shrink:0;}
  .view-btn{flex-shrink:0;border:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:800;color:#7a5fd0;background:#efe6ff;padding:8px 14px;border-radius:12px;transition:.12s;box-shadow:0 5px 12px -7px rgba(120,90,140,.5),inset 0 0 0 1px rgba(139,116,181,.12);}
  .view-btn:active{transform:scale(.94);}
  .food-chev{width:28px;height:28px;border-radius:50%;background:#f6f2fb;color:#b3a6cc;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center;}

  .tip{display:flex;gap:11px;background:#fff;border-radius:16px;padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow-soft);font-size:12.5px;color:#6a645f;font-weight:500;line-height:1.5;}
  .tip .tip-ic{font-size:19px;flex-shrink:0;}
  .tip b{color:var(--ink);font-weight:800;}

  /* brand guide tiers */
  .bg-cat{background:#fff;border-radius:20px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow-soft);}
  .bg-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
  .bg-head .bg-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .bg-head .bg-n{font-size:15.5px;font-weight:800;}
  .bg-tier{margin-bottom:11px;}
  .bg-tl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin-bottom:7px;}
  .bg-tl.prem{color:#b6871f;} .bg-tl.mid{color:#7a5fd0;} .bg-tl.eco{color:#2f8f5f;}
  .bg-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .bg-chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:12px;background:#f5f1fa;color:#4a443f;}
  .bg-chip.prem{background:#fff3d9;color:#9c7418;} .bg-chip.mid{background:#efe6ff;color:#6a4fc0;} .bg-chip.eco{background:#dff3e7;color:#2b7d54;}
  .bg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .bg-dot.prem{background:#e3b23c;} .bg-dot.mid{background:#9a83d6;} .bg-dot.eco{background:#45b67e;}
  .ci-row.brow{cursor:pointer;}

  /* books */
  .bk-card{display:flex;gap:13px;background:#fff;border-radius:18px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow-soft);}
  .bk-row{position:relative;display:flex;gap:13px;padding:12px;}
  .bk-row+.bk-row::before{content:'';position:absolute;left:12px;right:12px;top:0;height:1px;background:#f4eef9;}
  .bk-row .cbox{align-self:center;}
  .bk-row.done .cbox{background:linear-gradient(150deg,#a58fd8,#8f78c4);box-shadow:0 6px 12px -5px rgba(140,116,181,.6);}
  .bk-row.done .cbox svg{opacity:1;transform:scale(1);}
  .bk-row.done .bk-t{color:#b8b0c4;text-decoration:line-through;}
  .bk-row.done .bk-cover{opacity:.5;}
  .bk-cover{width:46px;height:60px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 14px -8px rgba(120,90,140,.5);}
  .bk-t{font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.25;}
  .bk-a{font-size:11.5px;color:#8574b5;font-weight:700;margin-top:2px;}
  .bk-s{font-size:11.5px;color:#8a8296;font-weight:500;margin-top:5px;line-height:1.45;}

  /* diy */
  .diy-card{background:#fff;border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow-soft);overflow:hidden;}
  .diy-head{display:flex;align-items:center;gap:13px;padding:14px 15px;cursor:pointer;}
  .diy-ic{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .diy-n{flex:1;font-size:15px;font-weight:800;}
  .diy-meta{font-size:11px;color:var(--muted);font-weight:700;}
  .diy-chev{color:#c3bad4;transition:transform .25s;flex-shrink:0;}
  .diy-card.open .diy-chev{transform:rotate(180deg);}
  .diy-ic{overflow:hidden;box-shadow:inset 0 0 0 1px rgba(139,116,181,.08);}
  .diy-card.done .cbox{background:linear-gradient(150deg,#a58fd8,#8f78c4);box-shadow:0 6px 12px -5px rgba(140,116,181,.6);}
  .diy-card.done .cbox svg{opacity:1;transform:scale(1);}
  .diy-card.done .diy-n{color:#b8b0c4;text-decoration:line-through;}
  .diy-card.done .diy-ic{opacity:.5;}
  .diy-body{max-height:0;overflow:hidden;transition:max-height .32s ease;}
  .diy-act{display:flex;gap:11px;padding:10px 16px;font-size:12.5px;color:#5a544f;line-height:1.5;font-weight:500;border-top:1px solid #f4eef9;}
  .diy-act .da-n{width:22px;height:22px;border-radius:50%;background:#efe6ff;color:#7a5fd0;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .diy-act b{color:var(--ink);font-weight:800;}

  /* food */
  .food-card{display:flex;gap:13px;background:#fff;border-radius:18px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow-soft);}
  .food-ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:23px;}
  .food-n{font-size:14.5px;font-weight:800;}
  .food-items{font-size:11.5px;color:#8a8296;font-weight:500;margin-top:3px;line-height:1.45;}
  .food-meta{display:flex;gap:7px;margin-top:7px;}
  .food-pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:9px;background:#efe9f7;color:#8574b5;}
  .food-pill.lvl{background:#dff3e7;color:#2b7d54;}
  .avoid-card{background:#fff;border-radius:20px;padding:6px 16px 10px;margin-bottom:12px;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(224,86,122,.08);overflow:hidden;}
  .ac-head{display:flex;align-items:center;gap:12px;padding:14px 2px 13px;border-bottom:1px solid #f4eef9;margin-bottom:4px;}
  .ac-ic{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(150deg,#ffe3ea,#ffd0db);box-shadow:inset 0 0 0 1px rgba(224,86,122,.12);}
  .ac-title{font-size:15.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);}
  .ac-sub{font-size:11.5px;font-weight:600;color:#b79aa4;margin-top:2px;}
  .avoid-item{display:flex;gap:11px;padding:11px 0;font-size:12.5px;color:#5a544f;font-weight:500;line-height:1.45;border-top:1px solid #f7f1f4;align-items:flex-start;}
  .avoid-item:first-child{border-top:none;}
  .avoid-item .av-x{width:19px;height:19px;border-radius:50%;background:#ffe0e6;color:#e0567a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
  .avoid-item .av-ok{width:19px;height:19px;border-radius:50%;background:#dff3e7;color:#2b9d63;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;}
  .food-grp+.avoid-item{border-top:none;}
  .avoid-item b{color:var(--ink);font-weight:800;}
  .food-grp{font-size:13px;font-weight:800;color:#8574b5;margin:16px 4px 9px;}

  /* travel planner */
  .planner{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow-soft);margin-top:4px;}
  .p-lbl{font-size:12px;font-weight:800;color:#8a8394;margin-bottom:9px;letter-spacing:.2px;}
  .day-step{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:9px 12px;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(139,116,181,.06);}
  .dstep{width:42px;height:42px;border-radius:13px;border:none;cursor:pointer;font-size:24px;font-weight:700;line-height:1;background:#f3eefb;color:#7a5fd0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(139,116,181,.14);transition:transform .1s;}
  .dstep:active{transform:scale(.9);}
  .day-val{flex:1;text-align:center;font-size:14px;font-weight:700;color:#8a8296;}
  .day-val b{font-size:19px;font-weight:800;color:var(--ink);}
  .dur-row{display:flex;gap:8px;flex-wrap:wrap;}
  .dur{flex:1 1 calc(50% - 4px);border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;padding:12px;border-radius:14px;background:var(--chip);color:#8574b5;transition:.14s;border:2px solid transparent;}
  .dur.on{background:linear-gradient(155deg,#b0a2d8,#9b8bc4);color:#fff;box-shadow:var(--btn-shadow);}
  .type-row{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;margin:0 -20px -8px;padding:10px 20px 20px;}
  .type-row::-webkit-scrollbar{display:none;}
  .ttype{flex:0 0 104px;border:none;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:800;padding:16px 6px;border-radius:16px;background:#fff;color:#8574b5;transition:.15s;border:2px solid transparent;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(139,116,181,.06);display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.2;text-align:center;}
  .ttype .te{font-size:22px;transition:transform .15s;}
  .ttype.on{background:linear-gradient(150deg,#efe7fb,#e2d6f6);border-color:var(--lav-2);color:var(--lav-3);box-shadow:0 10px 20px -10px rgba(140,116,181,.6);transform:translateY(-2px);}
  .ttype.on .te{transform:scale(1.12);}
  .trip-sum{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;background:linear-gradient(145deg,#b6a7de,#9784c3);color:#fff;border-radius:22px;padding:16px 18px;margin-top:18px;box-shadow:0 18px 34px -16px rgba(140,116,181,.75);}
  .trip-sum::before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;right:-46px;top:-56px;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 70%);}
  .trip-sum>*{position:relative;z-index:1;}
  .trip-sum .tse{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0;box-shadow:0 10px 20px -8px rgba(60,40,80,.4);}
  .trip-sum .tst{font-size:15.5px;font-weight:800;letter-spacing:-.2px;text-transform:capitalize;}
  .trip-sum .tstats{display:flex;gap:8px;margin-top:8px;}
  .trip-sum .tstat{font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:11px;}
  .trip-sum .tstat b{font-weight:800;}

  /* bottom nav */
  .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:104px;background:#fff;border-radius:30px 30px 0 0;display:flex;align-items:center;justify-content:space-around;padding:16px 26px 24px;z-index:6;
    -webkit-mask:radial-gradient(38px at 50% 15px,#0000 0 37px,#000 38px);mask:radial-gradient(38px at 50% 15px,#0000 0 37px,#000 38px);
    filter:drop-shadow(0 -12px 30px rgba(70,48,80,.26)) drop-shadow(0 -4px 12px rgba(70,48,80,.16));}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#bcb2a8;width:46px;cursor:pointer;}
  .nav-item .lbl{font-size:9.5px;font-weight:700;}
