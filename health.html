<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Tracker — Health</title>
<style>
  :root{
    --ink:#3a332e;--muted:#a99c92;--muted-2:#b6aca2;--card:#ffffff;--line:#efe7f0;--chip:#f5eff8;
    --lav-1:#b0a2d8;--lav-2:#9b8bc4;--lav-3:#8574b5;
    --field:#f7f4fb;
    /* health module accents (from the Records design) */
    --hp:#c4705a;  --hp-bg:#fef0e8;   /* health profile — terracotta */
    --gr:#5a78d4;  --gr-bg:#ebf0fe;   /* growth / visits — blue */
    --hn:#5a9880;  --hn-bg:#e8f5f1;   /* notes / vaccines — green */
    --dc:#9a5ad4;  --dc-bg:#f0eafe;   /* documents — purple */
    --shadow-soft:0 8px 22px -8px rgba(120,80,95,.18);
    --shadow-card:0 18px 40px -14px rgba(120,80,95,.18);
    --ring:inset 0 0 0 1px rgba(255,255,255,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#efeaf6,#e6e0f0 55%,#ece6f4);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px 0;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:var(--ink);
  }
  .phone{position:relative;width:390px;height:844px;border-radius:56px;background:#0c0c0c;
    box-shadow:0 50px 90px -30px rgba(40,20,30,.6),0 12px 30px rgba(40,20,30,.25),inset 0 0 0 2px #2a2a2a;overflow:hidden;}
  .screen{position:absolute;inset:11px;border-radius:46px;overflow:hidden;background:linear-gradient(180deg,#f6f3fa,#efebf5);}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:124px;}
  .scroll::-webkit-scrollbar{display:none;}
  .statusbar{position:relative;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:700;color:var(--ink);z-index:3;}
  .statusbar .time{font-size:16px;letter-spacing:.3px;}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:20px;}
  .status-icons{display:flex;align-items:center;gap:7px;}

  .content{position:relative;z-index:2;padding:2px 20px 30px;}
  .h-title{font-size:27px;font-weight:800;letter-spacing:-.5px;margin:4px 2px 13px;}
  .child-tabs{display:flex;gap:9px;margin:0 2px 16px;}
  .child-tab{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;padding:11px 10px;border-radius:16px;border:none;cursor:pointer;background:#fff;box-shadow:var(--shadow-soft),inset 0 0 0 1px rgba(139,116,181,.06);transition:transform .12s;font-family:inherit;}
  .child-tab:active{transform:scale(.98);}
  .child-tab .ct-name{font-size:14px;font-weight:800;color:#8a8788;letter-spacing:-.2px;white-space:nowrap;}
  .child-tab.active{background:linear-gradient(155deg,#b0a2d8,#9b8bc4);box-shadow:0 12px 22px -8px rgba(140,116,181,.6);}
  .child-tab.active .ct-name{color:#fff;}

  .rec-hero{position:relative;overflow:hidden;border-radius:16px;padding:16px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px;
    background:linear-gradient(150deg,#b0a2d8,#9279bd);color:#fff;
    box-shadow:0 18px 34px -16px rgba(140,116,181,.75),inset 0 0 0 1px rgba(255,255,255,.14);}
  .rec-hero::after{content:'';position:absolute;top:-44px;right:-32px;width:154px;height:154px;border-radius:50%;background:rgba(255,255,255,.12);}
  .rec-hero .rh-ic{position:relative;z-index:1;width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rec-hero .rh-ic svg{width:25px;height:25px;}
  .rec-hero .rh-txt{position:relative;z-index:1;}
  .rec-hero .rh-t{font-size:16.5px;font-weight:800;letter-spacing:-.3px;}
  .rec-hero .rh-s{font-size:12.5px;color:rgba(255,255,255,.9);font-weight:500;margin-top:3px;line-height:1.4;}

  /* record card */
  .rc{background:var(--card);border-radius:24px;overflow:hidden;margin-bottom:14px;box-shadow:0 13px 30px -16px rgba(120,80,95,.24),0 2px 7px rgba(30,26,23,.04),inset 0 0 0 1px rgba(255,255,255,.65);}
  .rc-head{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;}
  .rc-ic{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;flex-shrink:0;box-shadow:0 8px 18px -8px rgba(60,40,70,.3);}
  .rc-ic svg{width:24px;height:24px;position:relative;z-index:1;}
  .rc-ic::before{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;filter:blur(8px);opacity:.42;z-index:-1;transform:translateY(4px) scale(.84);}
  .rc-title{font-size:15px;font-weight:800;letter-spacing:-.2px;flex:1;}
  .rc-chev{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#b9b0c4;transition:transform .25s;}
  .rc.open .rc-chev{transform:rotate(180deg);}
  .rc-chev svg{width:17px;height:17px;}
  .rc-add{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;background:linear-gradient(155deg,#b0a2d8,#9b8bc4)!important;box-shadow:0 9px 16px -6px rgba(140,116,181,.6);}
  .rc-add svg{width:16px;height:16px;}
  .rc{cursor:pointer;transition:transform .12s;}
  .rc:active{transform:scale(.992);}
  .rc-body{display:none;padding:0 15px 15px;}
  .rc.open .rc-body{display:block;}

  /* record bottom sheet */
  .hs-layer{position:absolute;inset:0;z-index:45;visibility:hidden;}
  .hs-layer.open{visibility:visible;}
  .hs-bd{position:absolute;inset:0;background:rgba(30,20,26,.42);opacity:0;transition:opacity .3s;}
  .hs-layer.open .hs-bd{opacity:1;}
  .hs-panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:#fff;border-radius:32px 32px 46px 46px;transform:translateY(112%);transition:transform .42s cubic-bezier(.32,.72,0,1);box-shadow:0 -24px 54px -14px rgba(90,60,70,.42);}
  .hs-layer.open .hs-panel{transform:none;}
  .hs-grab{width:38px;height:5px;border-radius:3px;background:#e4ddee;margin:11px auto 5px;flex-shrink:0;}
  .hs-head{display:flex;align-items:center;gap:13px;padding:6px 20px 15px;flex-shrink:0;border-bottom:1px solid rgba(139,116,181,.11);}
  .hs-ht{flex:1;min-width:0;}
  .hs-title{font-size:18.5px;font-weight:800;letter-spacing:-.3px;line-height:1.15;}
  .hs-sub{font-size:11.5px;font-weight:600;color:#a197b4;margin-top:3px;}
  .hs-content{overflow-y:auto;padding:17px 20px 30px;}
  .hs-content::-webkit-scrollbar{display:none;}
  .hs-content .rc-body{display:block;padding:0;}
  .hs-content .rc-lbl{font-size:13.5px;font-weight:800;letter-spacing:-.1px;text-transform:none;color:var(--ink);margin:3px 2px 11px;}
  .hs-content .rc-lbl.sp{margin-top:18px;}
  #profileBody .rc-lbl{font-size:14.5px;letter-spacing:-.2px;margin:4px 2px 11px;}
  #profileBody .rc-lbl.sp{margin-top:20px;}

  .rc-lbl{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#a99fbb;margin:2px 2px 8px;}
  .rc-lbl.sp{margin-top:16px;}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:9px;}
  .chip{padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:800;border:none;cursor:pointer;font-family:inherit;transition:all .14s;flex-shrink:0;}
  .chip .x{margin-left:5px;opacity:.5;font-weight:800;}
  .chip.has-ic{display:inline-flex;align-items:center;gap:6px;}
  .chip.off,.bt-chip.off,.nt-chip.off,.vac-tab.off{background:#f1ecf8;color:#7a68ad;}
  .chip.on,.bt-chip.on,.nt-chip.on,.vac-tab.on{background:#a28cdb;color:#fff;box-shadow:0 7px 16px -7px rgba(140,116,181,.75);}
  .chip.on:active,.bt-chip.on:active,.nt-chip.on:active,.vac-tab.on:active{transform:scale(.96);}
  .chip-ic{width:14px;height:14px;flex-shrink:0;}
  .sug-chip{display:inline-flex;align-items:center;gap:7px;border-radius:13px;background:#fff;color:#7a68ad;box-shadow:inset 0 0 0 1px rgba(139,116,181,.22);padding:9px 16px;font-weight:800;}
  .sug-chip:active{transform:scale(.97);}
  .sug-em{width:24px;height:24px;border-radius:50%;background:#f1ecf8;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sug-em svg{width:13px;height:13px;}
  .al-none{background:#f1eef4;color:#a79fb0;}
  /* selected allergy chips (with icon badge) */
  .al-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 6px;border-radius:13px;background:#efeaf6;color:#7a68ad;font-size:12.5px;font-weight:800;}
  .al-chip.al-plain{padding-left:14px;}
  .al-chip .al-em{width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .al-chip .al-em svg{width:13px;height:13px;}
  .al-chip .x{margin-left:1px;}
  /* note-type picker grid */
  .nt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .nt-chip{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:800;text-align:left;transition:transform .12s;}
  .nt-chip:active{transform:scale(.98);}
  .nt-em{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .nt-em svg{width:16px;height:16px;}
  /* selectable option cards (icon + check) */
  .nt-card{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px 11px 11px;border-radius:15px;border:1.5px solid #ece7f1;background:#faf8fc;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s,background .15s,transform .12s;}
  .nt-card:active{transform:scale(.98);}
  .nt-card.on{border-color:#9b8bc4;background:#f3eefb;}
  .nt-row{display:flex;align-items:flex-start;justify-content:space-between;min-height:33px;}
  .nt-tile{width:33px;height:33px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(139,116,181,.1);}
  .nt-tile svg{width:17px;height:17px;}
  .nt-check{width:21px;height:21px;border-radius:50%;background:linear-gradient(155deg,#b0a2d8,#9b8bc4);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 9px -4px rgba(140,116,181,.6);}
  .nt-check svg{width:11px;height:11px;color:#fff;}
  .nt-name{font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
  /* blood type grid */
  .bt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .bt-chip{padding:12px 4px;border-radius:13px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;transition:transform .12s;}
  .bt-chip:active{transform:scale(.95);}
  .al-wrap{gap:9px;}
  .al-opt{padding:11px 17px;}
  /* add-allergy input */
  .al-input-row{display:flex;gap:8px;}
  .al-add-btn{flex-shrink:0;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:800;color:#fff;background:linear-gradient(155deg,#b0a2d8,#9b8bc4);border-radius:12px;padding:0 20px;box-shadow:0 10px 18px -8px rgba(140,116,181,.6);}
  .al-add-btn:active{transform:scale(.98);}

  /* inline add form */
  .form{margin-bottom:8px;}
  .form-title{display:none;}
  .fld-lab{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#9a8fb3;}
  .fld-lab>.fld,.fld-lab>.fld-suf{margin-top:6px;}
  .fld{width:100%;border:none;background:var(--field);border-radius:11px;padding:12px 13px;font-family:inherit;font-size:13.5px;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(139,116,181,.12);outline:none;}
  .fld:focus{box-shadow:inset 0 0 0 1.6px var(--lav-2);}
  .fld::placeholder{color:#b6aec0;}
  .fld-row{display:flex;gap:8px;align-items:center;}
  .fld-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .fld-suf{position:relative;}
  .fld-suf span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#9a8fb3;pointer-events:none;}
  .form-actions{display:flex;gap:8px;margin-top:18px;}
  .btn{flex:1;border:none;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:800;padding:15px;border-radius:26px;transition:transform .12s;}
  .btn-cancel{background:#efe9f3;color:#9a8fb3;}
  .btn-save{background:linear-gradient(155deg,#b0a2d8,#9b8bc4)!important;color:#fff;box-shadow:0 14px 24px -9px rgba(140,116,181,.65);}
  .btn-save:active{transform:scale(.99);}

  /* list rows */
  .row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:18px;background:#fff;border:1.5px solid rgba(139,116,181,.18);box-shadow:0 10px 24px -16px rgba(120,90,140,.38);margin-bottom:11px;}
  .row:last-child{margin-bottom:0;}
  .row-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .row-ic svg{width:20px;height:20px;stroke:#fff;}
  .row-main{flex:1;min-width:0;}
  .row-t{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.2px;}
  .row-s{font-size:12px;color:#8b8296;font-weight:500;margin-top:2px;line-height:1.35;}
  .row-date{font-size:11px;color:#b3aac2;font-weight:700;flex-shrink:0;margin-left:8px;white-space:nowrap;}
  .row-bdate{font-size:11px;color:#b3aac2;font-weight:700;margin-top:7px;}

  /* growth chart */
  .gr-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .gr-now{margin-left:auto;font-size:13px;font-weight:800;color:var(--ink);}
  .gr-now span{font-size:10px;color:#b3aac2;font-weight:600;margin-left:3px;}
  .chart-wrap{width:100%;}

  /* vaccine */
  .vac-tabs{display:flex;gap:7px;margin-bottom:12px;}
  .vac-tab{flex:1;padding:9px 4px;border-radius:20px;font-size:10.5px;font-weight:800;border:none;cursor:pointer;font-family:inherit;transition:all .12s;}
  .vac{padding:13px 14px;border-radius:18px;background:#fff;border:1.5px solid rgba(139,116,181,.18);box-shadow:0 10px 24px -16px rgba(120,90,140,.38);margin-bottom:11px;}
  .vac-row{display:flex;align-items:flex-start;gap:11px;}
  .vac-check{margin-top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
  .vac-check svg{width:13px;height:13px;color:#fff;}
  .vac-main{flex:1;min-width:0;}
  .vac-nrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .vac-name{font-size:13.5px;font-weight:800;color:var(--ink);}
  .vac-name.done{color:#aba3b5;text-decoration:line-through;}
  .vac-info{width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vac-info svg{width:12px;height:12px;}
  .vac-due{font-size:11px;color:#8b8296;font-weight:500;margin-top:3px;}
  .vac-rem{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;font-weight:700;color:#7a68ad;}
  .vac-rem svg{width:12px;height:12px;}
  .vac-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .vac-up{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;background:#f1ecf8;color:#7a68ad;}
  .vac-bell{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .vac-bell svg{width:15px;height:15px;}
  .vac-inline{display:flex;gap:7px;margin-top:9px;}
  .vac-inline .fld{padding:8px 11px;font-size:12px;}
  .vac-inline .mini{padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;}

  /* vaccine info sheet */
  .vs-layer{position:absolute;inset:0;z-index:55;visibility:hidden;}
  .vs-layer.open{visibility:visible;}
  .vs-bd{position:absolute;inset:0;background:rgba(30,20,26,.42);opacity:0;transition:opacity .3s;}
  .vs-layer.open .vs-bd{opacity:1;}
  .vs-panel{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;background:#fff;border-radius:28px 28px 46px 46px;padding:14px 20px 26px;transform:translateY(110%);transition:transform .36s cubic-bezier(.32,.72,0,1);}
  .vs-panel::-webkit-scrollbar{display:none;}
  .vs-layer.open .vs-panel{transform:none;}
  .vs-grab{width:40px;height:5px;border-radius:3px;background:#e2dcec;margin:2px auto 14px;}
  .vs-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .vs-cat{display:inline-block;font-size:10px;font-weight:800;padding:4px 11px;border-radius:20px;margin-bottom:8px;}
  .vs-name{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.25;}
  .vs-close{width:32px;height:32px;border-radius:50%;background:#efe9f3;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#9a8fb3;flex-shrink:0;}
  .vs-close svg{width:16px;height:16px;}
  .hs-add{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;background:linear-gradient(155deg,#b0a2d8,#9b8bc4);box-shadow:0 9px 16px -6px rgba(140,116,181,.6);transition:transform .12s;}
  .hs-add:active{transform:scale(.93);}
  .hs-add svg{width:17px;height:17px;}
  .vs-block{border-radius:14px;padding:13px 14px;margin-bottom:11px;}
  .vs-bl{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#8b8296;margin-bottom:5px;}
  .vs-bt{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4;}
  .vs-bt.reg{font-weight:500;color:#5a5360;}
  .vs-se{display:flex;flex-wrap:wrap;gap:7px;}
  .vs-se span{font-size:11px;font-weight:600;padding:6px 11px;border-radius:20px;background:#f3eff6;color:#7d7488;}

  /* bottom nav */
  .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:104px;background:#fff;border-radius:30px 30px 0 0;
    display:flex;align-items:center;justify-content:space-around;padding:16px 26px 24px;z-index:6;
    -webkit-mask:radial-gradient(38px at 50% 15px,#0000 0 37px,#000 38px);mask:radial-gradient(38px at 50% 15px,#0000 0 37px,#000 38px);
    filter:drop-shadow(0 -12px 30px rgba(70,48,80,.26)) drop-shadow(0 -4px 12px rgba(70,48,80,.16)) drop-shadow(0 -1px 3px rgba(70,48,80,.10));}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#bcb2a8;width:46px;cursor:pointer;}
  .nav-item .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1px;}
  .nav-item .tab-ic{display:flex;align-items:center;justify-content:center;height:24px;}
  .nav-item .ic-fill{display:none;}
  .nav-item.active{color:#9b8bc4;}
  .nav-item.active .ic-line{display:none;}
  .nav-item.active .ic-fill{display:block;}
  .nav-slot{width:56px;flex-shrink:0;}
  .nav-add{position:absolute;left:50%;bottom:61px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
    background:linear-gradient(155deg,#b0a2d8,#9b8bc4);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 22px -6px rgba(140,116,181,.55);z-index:8;cursor:pointer;}
  .home-indicator{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;opacity:.85;z-index:7;}

  .toast{position:absolute;left:50%;bottom:122px;transform:translateX(-50%) translateY(10px);background:rgba(35,22,12,.9);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:20px;z-index:80;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:80%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  [class*="-layer"],.addmenu{inset:0;border-radius:0}

  function setGrowthTab(t){growthTab=t;renderGrowth();}
  function renderGrowth(){
    document.querySelectorAll('[data-gt]').forEach(function(b){
      var on=b.getAttribute('data-gt')===growthTab;
      b.style.background=on?'var(--gr)':'var(--gr-bg)';
      b.style.color=on?'#fff':'var(--gr)';
    });
    var last=GROWTH[GROWTH.length-1];
    document.getElementById('grNow').innerHTML=(growthTab==='weight'?last.weight+' kg':last.height+' cm')+'<span>now</span>';
    // build SVG line chart
    var W=320,H=224,padL=34,padR=14,padT=20,padB=30;
    var cW=W-padL-padR, cH=H-padT-padB;
    var vals=GROWTH.map(function(g){return growthTab==='weight'?g.weight:g.height;});
    var dmin=Math.min.apply(null,vals), dmax=Math.max.apply(null,vals);
    var span=(dmax-dmin)||1;
    var min=dmin-span*0.18, max=dmax+span*0.18;
    if(min<0) min=0;
    var n=GROWTH.length;
    var x=function(i){return padL+cW*(i/(n-1));};
    var y=function(v){return padT+cH*(1-(v-min)/(max-min));};
    var col=growthTab==='weight'?'#c4705a':'#5a78d4';
    var unit=growthTab==='weight'?'kg':'cm';
    var base=padT+cH;
    var pts=GROWTH.map(function(g,i){return [x(i), y(growthTab==='weight'?g.weight:g.height)];});
    function sp(P){ if(P.length<2) return 'M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1); var d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1); for(var i=0;i<P.length-1;i++){var p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,t=0.16; var c1x=p1[0]+(p2[0]-p0[0])*t,c1y=p1[1]+(p2[1]-p0[1])*t,c2x=p2[0]-(p3[0]-p1[0])*t,c2y=p2[1]-(p3[1]-p1[1])*t; d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);} return d; }
    var lineP=sp(pts);
    var areaP=lineP+' L'+x(n-1).toFixed(1)+' '+base.toFixed(1)+' L'+x(0).toFixed(1)+' '+base.toFixed(1)+' Z';
    // y-axis gridlines + labels
    var TICKS=4, grid='';
    for(var k=0;k<=TICKS;k++){
      var gy=padT+cH*(k/TICKS);
      var gv=max-(max-min)*(k/TICKS);
      var lbl=growthTab==='weight'?gv.toFixed(1):Math.round(gv);
      grid+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#efecf5" stroke-width="1"/>';
      grid+='<text x="'+(padL-8)+'" y="'+(gy+3.2).toFixed(1)+'" font-size="9" fill="#bcb4c8" text-anchor="end" font-family="inherit" font-weight="600">'+lbl+'</text>';
    }
    var dots=GROWTH.map(function(g,i){var cy=y(growthTab==='weight'?g.weight:g.height);var lastOne=i===n-1;return '<circle cx="'+x(i).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(lastOne?5:3.4)+'" fill="#fff" stroke="'+col+'" stroke-width="2.4"/>';}).join('');
    var labels=GROWTH.map(function(g,i){var anc=i===0?'start':(i===n-1?'end':'middle');var lx=i===0?padL:(i===n-1?W-padR:x(i));return '<text x="'+lx.toFixed(1)+'" y="'+(H-10)+'" font-size="9" fill="#b8b0c4" text-anchor="'+anc+'" font-family="inherit" font-weight="600">'+esc(g.age)+'</text>';}).join('');
    // highlight tag on latest point
    var lv=vals[n-1], lvTxt=(growthTab==='weight'?lv.toFixed(1):Math.round(lv))+' '+unit;
    var lpx=x(n-1), lpy=y(lv), tagW=lvTxt.length*5.7+16;
    var tagX=Math.max(padL, Math.min(lpx-tagW/2, W-padR-tagW)), tagY=lpy-25; if(tagY<padT-2) tagY=lpy+9;
    var tag='<rect x="'+tagX.toFixed(1)+'" y="'+tagY.toFixed(1)+'" width="'+tagW.toFixed(1)+'" height="19" rx="9.5" fill="'+col+'"/><text x="'+(tagX+tagW/2).toFixed(1)+'" y="'+(tagY+13).toFixed(1)+'" font-size="10" fill="#fff" text-anchor="middle" font-family="inherit" font-weight="800">'+lvTxt+'</text>';
    var gid='grad'+growthTab;
    document.getElementById('growthChart').innerHTML=
      '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="'+col+'" stop-opacity="0.22"/>'+
      '<stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
      grid+
      '<path d="'+areaP+'" fill="url(#'+gid+')" stroke="none"/>'+
      '<path d="'+lineP+'" fill="none" stroke="'+col+'" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'+
      dots+labels+tag+'</svg>';
  }

    else if(noteType==='measurement'){var p=[d.temp&&d.temp+'°C',d.weight&&d.weight+' kg',d.height&&d.height+' cm'].filter(Boolean);if(!p.length){toast('Add a measurement');return;}summary=p.join(' · ');emoji='📏';}
    else if(noteType==='observation'){if(!d.mood){toast('Pick a mood');return;}summary=d.mood;emoji='😊';}
    else if(noteType==='reaction'){if(!d.reactTo){toast('Pick a trigger');return;}summary=d.reactTo+' · '+((d.reaction||[]).join(', ')||'reaction');emoji='⚠️';}
    else if(noteType==='sleep'){if(!d.duration){toast('Pick a duration');return;}summary=d.duration+' · '+(d.quality||'');emoji='😴';}
    else if(noteType==='feed'){if(!d.feedType){toast('Pick a feed type');return;}summary=d.feedType+' · '+(d.how||'');emoji='🍼';}
    var tag=(NOTE_TYPES.filter(function(x){return x.type===noteType;})[0]||{}).label||'';
    NOTES.unshift({date:TODAY,summary:summary,emoji:emoji,tag:tag});
    toggleNoteForm(false);renderNotes();toast('Note saved ✓');
  }
  var NOTE_COLOR={Symptom:'#ef7a66',Measurement:'#5a78d4',Observation:'#45b487',Reaction:'#f0a53c',Sleep:'#8f7cff',Feed:'#ef9a4e',Mood:'#e07a9e'};
  function renderNotes(){
    document.getElementById('notesList').innerHTML=NOTES.map(function(n){
      var ic=noteIcon(n.tag), col=NOTE_COLOR[n.tag]||'#9b8bc4';
      var icHTML=ic?'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg>':(n.emoji||'');
      return '<div class="row"><div class="row-ic" style="background:'+col+'">'+icHTML+'</div>'+
        '<div class="row-main"><div class="row-t">'+esc(n.summary)+'</div>'+(n.tag?'<div class="row-s">'+esc(n.tag)+'</div>':'')+'</div>'+
        '<div class="row-date">'+esc(n.date)+'</div></div>';
    }).join('');
  }

  /* ---------- Doctor Visits ---------- */
  function renderVReasons(){
    document.getElementById('vReasonChips').innerHTML=VISIT_REASONS.map(function(r){
      var on=r===vReason;
      return '<button class="chip '+(on?'on':'off')+'" onclick="vReason=\''+r+'\';renderVReasons()">'+r+'</button>';
    }).join('');
  }
  function saveVisit(){
    if(!vReason){toast('Pick a reason');return;}
    VISITS.unshift({title:vReason,date:document.getElementById('vDate').value.trim()||TODAY,doctor:document.getElementById('vDoctor').value.trim()||'Doctor',note:document.getElementById('vNote').value.trim()});
    vReason='';document.getElementById('vDate').value='';document.getElementById('vNote').value='';renderVReasons();
    toggleForm('visitForm',false);renderVisits();toast('Visit added ✓');
  }
  function renderVisits(){
    var STETH='<path d="M6 3v4.5a4.5 4.5 0 0 0 9 0V3"/><path d="M6 3H4.6M15 3h1.4"/><path d="M10.5 16.8v1.2a4.3 4.3 0 0 0 8.6 0V15"/><circle cx="19.1" cy="12.8" r="2.3"/>';
    var PILL='<path d="M10.5 3.5 3.5 10.5a5 5 0 0 0 7 7l7-7a5 5 0 0 0-7-7z"/><path d="M7 7l7 7"/>';
    document.getElementById('visitsList').innerHTML=VISITS.map(function(v){
      var sick=/sick|infection|ill|fever|flu|cold|rash|cough/i.test(v.title||'');
      var col=sick?'#ef7a66':'#45b487', ic=sick?PILL:STETH;
      return '<div class="row"><div class="row-ic" style="background:'+col+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div>'+
        '<div class="row-main"><div class="row-t">'+esc(v.title)+'</div><div class="row-s">'+esc(v.doctor)+(v.note?' · '+esc(v.note):'')+'</div><div class="row-bdate">'+esc(v.date)+'</div></div></div>';
    }).join('');
  }

  /* ---------- Documents ---------- */
  function renderDSource(){
    document.getElementById('dSourceChips').innerHTML=DOC_SOURCES.map(function(s){
      var on=s.label===dSource;
      return '<button class="nt-chip '+(on?'on':'off')+'" onclick="dSource=\''+s.label+'\';renderDSource()"><span class="nt-em" style="background:'+(on?'rgba(255,255,255,.25)':'#fff')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+s.svg+'</svg></span>'+s.label+'</button>';
    }).join('');
  }
  function renderDType(){
    document.getElementById('dTypeChips').innerHTML=DOC_TYPES.map(function(t){
      var on=t===dType;
      return '<button class="chip '+(on?'on':'off')+'" onclick="dType=\''+t+'\';renderDType()">'+t+'</button>';
    }).join('');
  }
  function saveDoc(){
    var name=document.getElementById('dName').value.trim();
    if(!dType||!name){toast('Pick a type & name');return;}
    DOCS.unshift({name:name,type:dType,date:document.getElementById('dDate').value.trim()||TODAY});
    dSource='';dType='';document.getElementById('dName').value='';document.getElementById('dDate').value='';renderDSource();renderDType();
    toggleForm('docForm',false);renderDocs();toast('Document added ✓');
  }
  function renderDocs(){
    document.getElementById('docsList').innerHTML=DOCS.map(function(d){
      return '<div class="row"><div class="row-ic" style="background:#9b5fd6"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11V7a2 2 0 0 0-2-2h-3.2l-1.3-1.6A2 2 0 0 0 10.9 3H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><circle cx="18" cy="17.5" r="3"/><path d="M18 16v1.5l1 .8"/></svg></div>'+
        '<div class="row-main"><div class="row-t">'+esc(d.name)+'</div><div class="row-s">'+esc(d.type)+' · '+esc(d.date)+'</div></div></div>';
    }).join('');
  }

  /* ---------- Vaccinations ---------- */
  function renderVacTabs(){
    document.getElementById('vacTabs').innerHTML=VAC_CAT.map(function(c){
      var on=c.key===vacTab;
      return '<button class="vac-tab '+(on?'on':'off')+'" onclick="vacTab=\''+c.key+'\';renderVac()">'+c.label+'</button>';
    }).join('');
  }
  function renderVac(){
    renderVacTabs();
    var list=VACCINES.filter(function(v){return v.category===vacTab;});
    document.getElementById('vacList').innerHTML=list.map(function(v){
      var h='<div class="vac"><div class="vac-row">';
      h+='<button class="vac-check" style="'+(v.done?'border-color:#9b8bc4;background:#9b8bc4':'')+'" onclick="toggleVacMark(\''+v.id+'\')">'+(v.done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':'')+'</button>';
      h+='<div class="vac-main"><div class="vac-nrow"><span class="vac-name'+(v.done?' done':'')+'">'+esc(v.name)+'</span>';
      h+='<button class="vac-info" style="background:#f1ecf8;color:#7a68ad" onclick="openVacInfo(\''+v.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></button></div>';
      h+='<div class="vac-due">'+esc(v.dueAge)+' · '+(v.done?'Done '+esc(v.doneDate):'Due '+esc(v.dueDate))+'</div>';
      if(v.reminder)h+='<div class="vac-rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Reminder: '+esc(v.reminder)+'</div>';
      if(vacMarkId===v.id)h+='<div class="vac-inline"><input class="fld" id="vacMarkInput" value="'+esc(vacMarkDate)+'" placeholder="Date done"><button class="mini" style="background:linear-gradient(155deg,#b0a2d8,#9b8bc4)" onclick="markVacDone(\''+v.id+'\')">Done</button></div>';
      if(reminderEdit===v.id)h+='<div class="vac-inline"><input class="fld" id="remInput" placeholder="Reminder date"><button class="mini" style="background:linear-gradient(155deg,#b0a2d8,#9b8bc4)" onclick="saveReminder(\''+v.id+'\')">Set</button></div>';
      h+='</div><div class="vac-right">';
      if(!v.done)h+='<span class="vac-up">Upcoming</span><button class="vac-bell" style="background:'+(v.reminder?'#f1ecf8':'#efe9f3')+'" onclick="toggleReminder(\''+v.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="'+(v.reminder?'#7a68ad':'#9a8fb3')+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>';
      h+='</div></div></div>';
      return h;
    }).join('') || '<div class="row-s" style="padding:10px 2px">No vaccines in this group.</div>';
  }
  function toggleVacMark(id){var v=VACCINES.find(function(x){return x.id===id;});if(v.done)return;vacMarkId=vacMarkId===id?null:id;vacMarkDate=TODAY;reminderEdit=null;renderVac();}
  function markVacDone(id){var d=document.getElementById('vacMarkInput').value.trim()||TODAY;VACCINES.find(function(x){return x.id===id;}).done=true;VACCINES.find(function(x){return x.id===id;}).doneDate=d;vacMarkId=null;renderVac();toast('Marked done ✓');}
  function toggleReminder(id){reminderEdit=reminderEdit===id?null:id;vacMarkId=null;renderVac();}
  function saveReminder(id){var d=document.getElementById('remInput').value.trim();if(!d){toast('Enter a date');return;}VACCINES.find(function(x){return x.id===id;}).reminder=d;reminderEdit=null;renderVac();toast('Reminder set 🔔');}
  function openVacInfo(id){
    var v=VACCINES.find(function(x){return x.id===id;});
    var cat=VAC_CAT.filter(function(c){return c.key===v.category;})[0];
    document.getElementById('vacInfoPanel').innerHTML=
      '<div class="vs-grab"></div>'+
      '<div class="vs-head"><div><span class="vs-cat" style="background:#f1ecf8;color:#7a68ad">'+cat.label+'</span><div class="vs-name">'+esc(v.name)+'</div></div>'+
      '<button class="vs-close" onclick="closeVacInfo()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
      '<div class="vs-block" style="background:#f6f3fb"><div class="vs-bl">Protects against</div><div class="vs-bt">'+esc(v.protects)+'</div></div>'+
      '<div class="vs-block" style="background:#f1ecf8"><div class="vs-bl">Why it matters</div><div class="vs-bt reg">'+esc(v.why)+'</div></div>'+
      '<div class="vs-bl" style="margin:2px 2px 9px">Common side effects</div><div class="vs-se">'+v.sideEffects.map(function(s){return '<span>'+esc(s)+'</span>';}).join('')+'</div>';
    document.getElementById('vacInfo').classList.add('open');
  }
  function closeVacInfo(){document.getElementById('vacInfo').classList.remove('open');}

  /* ---------- init ---------- */
  renderChildTabs();
  renderBlood();renderAllergies();renderGrowth();
  renderNotes();renderVReasons();renderVisits();renderDSource();renderDType();renderDocs();renderVac();
</script>
</body>
</html>
